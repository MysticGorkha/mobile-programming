<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
<style>
    .card {
        width: 300px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
    }
    .card img {
        border-radius: 50%;
        margin-bottom: 10px;
    }
    .card p {
        margin: 5px 0;
    }
    .card button {
        margin-top: 10px;
        padding: 5px 10px;
        border: none;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        border-radius: 3px;
    }
    .card button:hover {
        background-color: #0056b3;
    }
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="profile.js" defer></script>
</head>
<body>
<div class="card">
    <img id="pp" src="my_profile.jpg" alt="Profile Picture" width="100" height="100">
    <p>Name: Sijan Khadka</p>
    <p>Profile: Student</p>
    <p>Address: Kalanki</p>
    <p>Contact: 9841234567</p>
    <img id="qr" src="github.png" alt="GitHub QR" width="100" height="100">
    <br>
    <button id="show-qr">Show QR</button>
    <button id="hide-qr">Hide QR</button>
</div>
</body>
</html>
