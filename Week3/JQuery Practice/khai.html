<!DOCTYPE html>

<html>
<head>
    <title>jQuery Profile</title>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>

    body {
        font-family: Arial;
    }

    .profile {
        width: 300px;
        border: 1px solid black;
        padding: 20px;
        float: left;
    }

    .profile img {
        width: 120px;
        height: 120px;
    }

    .buttons {
        margin-left: 400px;
    }

    button {
        margin: 5px;
        padding: 8px;
    }

    #output {
        margin-top: 20px;
        border: 1px solid black;
        padding: 10px;
        width: 300px;
    }

    .highlight {
        border: 5px solid yellow;
    }

    .dark {
        background-color: black;
        color: white;
    }

    .round {
        border-radius: 50%;
    }

</style>


</head>

<body>

<!-- Profile Card -->

<div class="profile" id="profile-card">

    <img id="profile-photo" src="my_profile.jpg">

    <h2 id="student-name">Sijan Khadka</h2>

    <p id="student-bio">
        I am a student learning jQuery and a video editor.
    </p>

    <input type="text" id="nickname-input" placeholder="Enter nickname">

    <h3>My Skills</h3>

    <ul id="skills-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>jQuery</li>
    </ul>

</div>


<!-- Buttons -->

<div class="buttons">

    <h3>GET & SET</h3>
        <button id="show-name">Show Name</button>
        <button id="change-name">Change Name</button>
        <button id="show-bio">Show Bio</button>
        <button id="get-input">Get Input</button>
        <button id="set-input">Set Input</button>
    <h3>CSS Classes</h3>
        <button id="highlight-card">Highlight Card</button>
        <button id="remove-highlight">Remove Highlight</button>
        <button id="toggle-dark">Toggle Dark Mode</button>
        <button id="toggle-rounded">Toggle Rounded</button>
    <h3>CSS Method</h3>
        <button id="red-background">Red Background</button>
        <button id="reset-background">Reset Background</button>
    <h3>Hide & Show</h3>
        <button id="hide-photo">Hide Photo</button>
        <button id="show-photo">Show Photo</button>
        <button id="toggle-bio">Toggle Bio</button>
    <h3>Fade</h3>
        <button id="fade-out">Fade Out Card</button>
        <button id="fade-in">Fade In Card</button>
        <button id="fade-50">Fade 50%</button>
    <h3>Slide</h3>
        <button id="slide-up">Slide Up Skills</button>
        <button id="slide-down">Slide Down Skills</button>
        <button id="slide-toggle">Slide Toggle Skills</button>
    <h3>Animation</h3>
        <button id="animate-card">Animate Card</button>
    <div id="output"> Output will appear here </div>
</div>
<script src="khai.js"></script>


</body>
</html>
